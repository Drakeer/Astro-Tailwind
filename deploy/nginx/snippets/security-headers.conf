# Security headers, factored into a snippet.
#
# WHY A SNIPPET: nginx's add_header is NOT cumulative across blocks. Headers
# from an outer block are inherited ONLY if the inner block declares no
# add_header of its own. The moment a location adds its own Cache-Control,
# every server-level security header silently vanishes for that location.
# So this file must be re-included in EVERY location that sets its own header.
# This is the single most common way security headers get half-applied.
#
# The "always" flag makes each header apply to error responses (404/50x) too,
# not just 2xx/3xx.

# Stop browsers from MIME-sniffing a response into a different content type.
add_header X-Content-Type-Options "nosniff" always;

# Send origin only on cross-origin, and nothing when downgrading scheme.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Legacy clickjacking backstop. Superseded by CSP frame-ancestors below, but
# kept for old browsers that do not honour frame-ancestors.
add_header X-Frame-Options "DENY" always;

# Content-Security-Policy, tuned to what this site actually loads:
#   script-src 'unsafe-inline' -> the site has 2 inline <script> blocks (the
#     .js class flag and the scroll-reveal IntersectionObserver). The strict
#     alternative is 'sha256-...' hashes, but those change on every content
#     edit and would have to be updated on the SERVER after each rsync deploy
#     -- a silent page-breaker. See COMMANDS.md for the hash upgrade path.
#   img-src data: -> the favicon <link> is an inline data:image/svg+xml URI.
#   frame-ancestors 'none' -> this site should never be embedded.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Turn off browser features this site never uses.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), browsing-topics=()" always;

# Cross-origin isolation. Safe here because the site loads zero third-party
# resources, so nothing legitimate gets blocked.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# HSTS is intentionally NOT set yet -- it is meaningless over plain HTTP and
# actively dangerous to enable before TLS works, because a browser that sees
# it will refuse to reach the site over HTTP afterwards. Enable in the HTTPS
# lesson, starting with a SHORT max-age until you are confident:
# add_header Strict-Transport-Security "max-age=300" always;
